[project]
name = "home-tcl-dashboard"
description = "Self-hosted wall dashboard of the next TCL departures (Lyon), for a tablet."
version = "0.1.0"
requires-python = ">=3.14"
dependencies=[
    "requests>=2.34.2,<3",
    "python-dotenv>=1.2.4,<2",
    "fastapi>=0.143.2,<0.144",
    "uvicorn>=0.54.0,<0.55",
]
readme="README.md"
license="MIT"
license-files=["LICENSE"]
authors=[{ name = "Rodolphe Momier", email = "momier.rodolphe@gmail.com"}]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
url = "https://github.com/momierr/home-tcl-dashboard/"

[project.scripts]
home-tcl-dashboard="home_tcl_dashboard.__main__:main"
