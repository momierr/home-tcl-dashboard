[project]
name = "home-tcl-dashboard"
description = "Self-hosted wall dashboard of the next TCL departures (Lyon), for a tablet."
dynamic = ["version"]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2,<3",
    "python-dotenv>=1.2.4,<2",
    "fastapi>=0.143",
    "uvicorn>=0.54.0,<0.55",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rodolphe Momier", email = "momier.rodolphe@gmail.com"}]


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.urls]
homepage = "https://github.com/momierr/home-tcl-dashboard/"

[project.scripts]
home-tcl-dashboard = "home_tcl_dashboard.__main__:main"

[tool.hatch.version]
source = "vcs"
