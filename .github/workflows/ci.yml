name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            command: ruff check .
          - name: format
            command: ruff format --check .
          - name: mypy
            command: mypy src
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true
          activate-environment: true
      - run: ${{ matrix.command }}

  tests:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true
          activate-environment: true
      - run: pytest -v
