[workspace]
authors = ["Rodolphe Momier <momier.rodolphe@gmail.com>"]
channels = ["conda-forge"]
name = "home-tcl-dashboard"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.14.0,<3.15"
requests = ">=2.34.2,<3"

[pypi-dependencies]
home-tcl-dashboard = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=9.1.1,<10"
ruff = ">=0.17.0,<0.18"
mypy = ">=2.4.0,<3"
pre-commit = ">=4.7.0,<5"

[feature.dev.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy src tests"
test = "pytest -v"

[environments]
default = ["dev"]
prod = []

[activation.env]
PIP_CONFIG_FILE = "/dev/null"
