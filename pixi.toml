[workspace]
authors = ["Rodolphe Momier <momier.rodolphe@gmail.com>"]
channels = ["conda-forge"]
name = "home-tcl-dashboard"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.14.0,<3.15"
requests = ">=2.34.2,<3"
python-dotenv = ">=1.2.4,<2"
pandas = ">=3.0.6,<4"
fastapi = ">=0.143.2,<0.144"
uvicorn = ">=0.54.0,<0.55"

[pypi-dependencies]
home-tcl-dashboard = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=9.1.1,<10"
ruff = ">=0.17.0,<0.18"
mypy = ">=2.4.0,<3"
pre-commit = ">=4.7.0,<5"
httpx2 = ">=2.13.1,<3"

[feature.dev.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy src tests"
test = "pytest -v"

[environments]
default = ["dev"]
prod = []

[activation.env]
PIP_CONFIG_FILE = "/dev/null"

[tasks]
serve = "uvicorn home_tcl_dashboard.app:app --host 0.0.0.0 --port 8000 --reload"
